<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https://doc.jenanote.local data:; font-src 'self'">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="toolbar" role="toolbar"></div>
<div id="find-bar" hidden>
  <div class="find-row">
    <input id="find-input" type="text" autocomplete="off" spellcheck="false">
    <span id="find-count"></span>
    <button type="button" id="find-previous" tabindex="-1">&#8593;</button>
    <button type="button" id="find-next" tabindex="-1">&#8595;</button>
    <button type="button" id="find-close" tabindex="-1">&#215;</button>
  </div>
  <div class="find-row" id="replace-row" hidden>
    <input id="replace-input" type="text" autocomplete="off" spellcheck="false">
    <button type="button" id="replace-one"></button>
    <button type="button" id="replace-all"></button>
  </div>
</div>
<div id="workspace">
<div id="stage">
  <div id="scroller">
    <div id="page-clip">
      <div id="editor" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>
  <div id="ruler-layer"></div>
  <div id="source-view" hidden>
    <div id="source-header">
      <span id="source-description"></span>
      <button type="button" id="source-copy"></button>
    </div>
    <pre id="source-text" tabindex="0"></pre>
  </div>
  <div id="page-indicator" hidden>
    <button type="button" id="page-previous" tabindex="-1">&#8249;</button>
    <span id="page-number"></span>
    <button type="button" id="page-next" tabindex="-1">&#8250;</button>
  </div>
</div>
<div id="ai-splitter" hidden></div>
<aside id="ai-panel" hidden>
  <div id="ai-header">
    <span id="ai-document"></span>
    <button type="button" id="ai-settings" tabindex="-1">&#8943;</button>
  </div>
  <button type="button" id="ai-work" tabindex="-1">
    <span id="ai-work-dot"></span>
    <span id="ai-work-text"></span>
    <span id="ai-work-button"></span>
  </button>
  <div id="ai-transcript">
    <div id="ai-messages"></div>
    <div id="ai-loading" hidden><span class="ai-progress"></span><span id="ai-waiting"></span></div>
  </div>
  <div id="ai-composer">
    <div id="ai-selection" hidden></div>
    <textarea id="ai-input" rows="3" spellcheck="false"></textarea>
    <div id="ai-options">
      <div id="ai-mode" class="segments">
        <button type="button" data-mode="guide" tabindex="-1"></button>
        <button type="button" data-mode="edit" tabindex="-1"></button>
      </div>
      <button type="button" id="ai-usage" tabindex="-1">&#9432;</button>
      <select id="ai-model"></select>
      <button type="button" id="ai-send" tabindex="-1"></button>
    </div>
  </div>
  <div id="ai-footer">
    <span id="ai-usage-status"></span>
    <button type="button" id="ai-usage-reload" tabindex="-1">&#8635;</button>
  </div>
</aside>
</div>
<div id="ai-usage-popover" class="popover" hidden>
  <div id="ai-session"></div>
  <div id="ai-usage-details"></div>
  <button type="button" id="ai-usage-refresh" tabindex="-1"></button>
</div>
<dialog id="ai-model-dialog">
  <form method="dialog">
    <label><span id="ai-model-label"></span><input id="ai-model-input" type="text" autocomplete="off" spellcheck="false"></label>
    <div class="dialog-buttons">
      <button value="cancel" id="ai-model-cancel" formnovalidate></button>
      <button value="ok" id="ai-model-ok"></button>
    </div>
  </form>
</dialog>
<div id="appearance-popover" class="popover" hidden></div>
<div id="bookmark-popover" class="popover" hidden></div>
<dialog id="link-dialog">
  <form method="dialog">
    <label><span id="link-label"></span><input id="link-url" type="text" autocomplete="off"></label>
    <div class="dialog-buttons">
      <button value="cancel" id="link-cancel" formnovalidate></button>
      <button value="ok" id="link-ok"></button>
    </div>
  </form>
</dialog>
<input id="color-input" type="color" tabindex="-1">
<div id="proof-popover" hidden>
  <div class="proof-label" id="proof-original-label"></div>
  <div class="proof-text" id="proof-original"></div>
  <div class="proof-label" id="proof-suggestion-label"></div>
  <div class="proof-text" id="proof-suggestion"></div>
  <div class="dialog-buttons">
    <button type="button" id="proof-add"></button>
    <button type="button" id="proof-apply"></button>
  </div>
</div>
<script src="editor.js"></script>
<script src="reading.js"></script>
<script src="proofreading.js"></script>
<script src="find.js"></script>
<script src="source.js"></script>
<script src="ai.js"></script>
<script src="start.js"></script>
</body>
</html>
